[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Os endereços das telas antigas continuam funcionando.
#
# As telas antigas foram apagadas quando o desenho novo ficou pronto.
# Link salvo nos favoritos, mandado no WhatsApp ou colado numa ata
# continua abrindo — agora na tela nova, com o que vier depois do '?'
# intacto (o ?id= do perfil, o ?turma= do painel).
#
# Duas regras por tela, uma com o nome escrito e outra com os espaços
# em %20: o endereço chega das duas formas conforme quem o montou, e
# uma regra que não casa é um 404 silencioso.
#
# 301 e não 302: é mudança definitiva, e o navegador pode guardar.

[[redirects]]
  from = "/ISR - Central.dc.html"
  to = "/ISR%20-%20Central%20v3.dc.html"
  status = 301
  force = true

[[redirects]]
  from = "/ISR%20-%20Central.dc.html"
  to = "/ISR%20-%20Central%20v3.dc.html"
  status = 301
  force = true

