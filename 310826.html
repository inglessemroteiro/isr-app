document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x}\n.st1{display:flex;gap:11px;align-items:flex-start}\n.st1 .sn{flex:0 0 24px;height:24px;border-radius:8px;background:#348a8e;color:#fffdf8;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}\n.st1 p{font-size:13.5px;line-height:1.5;color:#3a514f}\n.st1 p b{color:#164951}\n.ex1{border-left:3px solid #fc9082;padding-left:12px;font-size:13.5px;line-height:1.8;color:#164951;margin-top:10px}\n.ex1 s{color:#b09a89}\n.ex1 b{background:#eef6e2;padding:1px 5px;border-radius:4px}\n.kit{border:1.5px solid #d9cbbb;border-radius:14px;padding:13px 16px;margin-top:10px}\n.kit .km{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#8a7465}\n.kit .kl{font-size:13.5px;line-height:1.75;color:#164951;margin-top:5px}\n.quote{border-left:3px solid #9ec970;padding-left:12px;font-size:12.5px;line-height:1.5;color:#8a7465;font-style:italic;margin-top:8px}\n.bar{flex:0 0 auto;background:#fffdf8;border-top:1px solid #e7ddcf;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center}\n.bar .inner{width:100%;max-width:560px;display:flex;flex-direction:column;gap:7px}\n.send{width:100%;min-height:56px;border:none;border-radius:14px;background:#fc9082;color:#164951;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:background .18s cubic-bezier(.4,0,.2,1)}\n.send:hover{background:#9ec970}\n.st{font-size:12px;font-weight:600;color:#8a7465;text-align:center;min-height:16px;line-height:1.4}\n.prog{height:5px;border-radius:99px;background:#eee4d6;overflow:hidden}\n.pfill{display:block;height:100%;background:#9ec970;width:9%;border-radius:99px;transition:width .25s cubic-bezier(.4,0,.2,1)}\n.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.pnum{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a7465}\n.back{background:transparent;border:none;font-family:inherit;font-size:13px;font-weight:700;color:#229090;cursor:pointer;padding:4px 2px}\n.back:hover{color:#164951}\n.back[hidden]{visibility:hidden;display:block}\n.foot{padding:22px 20px 8px;text-align:center;font-size:11px;color:#8a7465;font-weight:600;line-height:1.6}\n.foot b{color:#229090}\n\n.fb{display:none;margin-top:9px;border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px;line-height:1.5}\n.fb.ok{display:block;background:#eef6e2;border-left:4px solid #9ec970;color:#2e4a3a}\n.fb.no{display:block;background:#fdece9;border-left:4px solid #fc9082;color:#164951}\n.aud-off{opacity:.55;pointer-events:none}\n.aud-off .go{background:#c9b8a8}\n.grid3{display:flex;flex-direction:column;gap:6px;margin-top:8px}\n.grid3 .fin{min-height:44px;font-size:13px;padding:10px 12px}\n.glabel{font-size:10px;font-weight:700;color:#8a7465;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}\n\n.ident{background:#f1f7f4;border:1.5px solid #b9d6cf;border-radius:12px;padding:12px 15px;font-size:13.5px;color:#164951;line-height:1.5}\n.ident a{font-weight:700}\n.pos-envio{display:none;background:#eef6e2;border:1.5px solid #9ec970;border-radius:14px;padding:16px;margin-top:14px;text-align:center}\n.pos-envio p{font-size:14px;font-weight:700;color:#2e4a3a;margin-bottom:12px}\n.pos-envio a{display:inline-block;background:#164951;color:#fffdf8;font-size:13px;font-weight:800;padding:12px 22px;border-radius:99px;text-decoration:none}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"app\">\n\n<div class=\"hero\">\n<span class=\"kicker\">Desafio · Inglês sem Roteiro<\u002Fspan>\n<!-- ═══ TROCAR TODA SEMANA: título ═══ -->\n<h1>Semana 5 — Marcar um horário<\u002Fh1>\n<span class=\"tag\">Material da aluna<\u002Fspan>\n<\u002Fdiv>\n\n<!-- TELA 1 · identidade (automática) + como funciona -->\n<div class=\"step\">\n<!-- NÃO ALTERAR: a identidade vem do login; os campos ocultos seguem\n     alimentando a planilha, preenchidos sozinhos -->\n<div class=\"ident\" id=\"ident-linha\">Carregando sua identificação…<\u002Fdiv>\n<div id=\"ident-campos\" hidden=\"\">\n<span class=\"lbl\">Nome<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"nome\" placeholder=\"Nome completo\">\n<span class=\"lbl\">E-mail<\u002Fspan>\n<input class=\"fin\" type=\"email\" data-f=\"email\" placeholder=\"e-mail usado na matrícula\">\n<\u002Fdiv>\n\n<span class=\"lbl\">Como funciona a semana<\u002Fspan>\n<!-- ═══ TROCAR TODA SEMANA: o combinado da semana ═══ -->\n<div class=\"rows\">\n<div class=\"row\"><span class=\"rk\">Segunda<\u002Fspan><span class=\"rv\">Recebimento do material e dos áudios.<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Durante a semana<\u002Fspan><span class=\"rv\">Preparação da ligação e publicação do plano no grupo.<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Até quinta<\u002Fspan><span class=\"rv\">Envio do áudio de ensaio, no privado.<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Depois da ligação<\u002Fspan><span class=\"rv\">Publicação do relato no grupo.<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Sexta<\u002Fspan><span class=\"rv\">Devolutiva individual, por áudio.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ TROCAR TODA SEMANA: telas de conteúdo ═════════════════════\n     Cada <div class=\"step\"> é uma tela do passo a passo. Crie\n     quantas quiser. Campos que devem ir para a planilha levam\n     data-f=\"nome_do_campo\" (um nome por campo, sem repetir). ═══ -->\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">📌<\u002Fspan><div><span class=\"sub\">Enunciado<\u002Fspan><h2>O objetivo desta semana<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<p class=\"b\"><b>Ao final da semana, você deve ser capaz de ligar para um lugar, fazer uma pergunta específica e entender a resposta, mesmo quando ela não é um simples sim ou não.<\u002Fb><\u002Fp>\n<p class=\"b\">Uma pergunta de hotel raramente recebe sim ou não. Ela recebe uma resposta com condição, preço e detalhe, dita em ritmo natural, e sem ninguém na sua frente para você acompanhar pela expressão. Entender essa resposta é o trabalho da semana.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">📤<\u002Fspan><div><span class=\"sub\">As entregas<\u002Fspan><h2>O que você vai entregar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<div class=\"rows\">\n<div class=\"row\"><span class=\"rk\">No grupo<\u002Fspan><span class=\"rv\">Antes de ligar: compartilhe em inglês, com o grupo, onde você vai ligar e o que vai perguntar.<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">No privado<\u002Fspan><span class=\"rv\">Até quinta: o áudio de ensaio, a sua parte da ligação, do começo ao fim.<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">No grupo<\u002Fspan><span class=\"rv\">Depois de ligar: compartilhe em inglês, com o grupo, como foi a sua experiência.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"b\" style=\"margin-top:12px\">O áudio do privado é a sua <b>preparação<\u002Fb>. Ele mostra que você chegou pronta à ligação.<\u002Fp>\n<p class=\"b\">Você não vai gravar a ligação. A outra pessoa não sabe que está participando de um exercício.<\u002Fp>\n<a class=\"audio\" href=\"https://drive.google.com/file/d/1CudDym-t3xqSJV1sFA-e80914iNOLF79/view\" target=\"_blank\" rel=\"noopener\"><span class=\"ic\">🎧<\u002Fspan><span class=\"ac\"><span class=\"an\">ÁUDIO A2 — só a sua parte · 25s<\u002Fspan><span class=\"ad\">É exatamente o formato do áudio de ensaio que você vai me enviar.<\u002Fspan><\u002Fspan><span class=\"go\">ouvir<\u002Fspan><\u002Fa>\n<span class=\"lbl\">As quatro etapas<\u002Fspan>\n<div class=\"rows\">\n<div class=\"row\"><span class=\"rk\">🔍 Observar<\u002Fspan><span class=\"rv\">Coleta as frases dos quatro momentos da ligação.<i>produz o quadro preenchido<\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">✏️ Adaptar<\u002Fspan><span class=\"rv\">Monta a sua ligação, com as suas perguntas.<i>produz o roteiro escrito<\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">🎧 Testar<\u002Fspan><span class=\"rv\">Treina até as frases saírem sem o papel.<i>produz a ligação na memória<\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">🎙️ Aplicar<\u002Fspan><span class=\"rv\">Liga de verdade.<i>produz a informação que você foi buscar<\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">📞<\u002Fspan><div><span class=\"sub\">A sua ligação<\u002Fspan><h2>Para onde ligar, e o que perguntar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<p class=\"b\">Ligue para um hotel e faça <b>uma pergunta que você faria de verdade<\u002Fb>. Você não precisa reservar nada: perguntar antes de reservar é o que qualquer pessoa faz, e a recepção responde justamente por isso.<\u002Fp>\n<span class=\"lbl\">Onde<\u002Fspan>\n<p class=\"b\"><b>Fora do Brasil<\u002Fb> — qualquer hotel da sua cidade ou de um lugar para onde você vai viajar.<\u002Fp>\n<p class=\"b\"><b>No Brasil<\u002Fb> — redes internacionais atendem em inglês como rotina: Hilton, Marriott, Hyatt, InterContinental, Accor. Também é possível ligar para fora, e muitos hotéis atendem por WhatsApp.<\u002Fp>\n<span class=\"lbl\">O que perguntar<\u002Fspan>\n<div class=\"rows\">\n<div class=\"row\"><span class=\"rk\">Estacionamento<\u002Fspan><span class=\"rv\"><em>Do you have parking? How much is it per night?<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Café da manhã<\u002Fspan><span class=\"rv\"><em>Is breakfast included in the room rate?<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Opção vegana<\u002Fspan><span class=\"rv\"><em>Do you have vegan options at breakfast?<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Ar-condicionado<\u002Fspan><span class=\"rv\"><em>Do the rooms have air conditioning?<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Bagagem<\u002Fspan><span class=\"rv\"><em>Can I leave my luggage after check-out?<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"row\"><span class=\"rk\">Animais<\u002Fspan><span class=\"rv\"><em>Are you pet-friendly?<\u002Fem><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\"><b>Prepare duas perguntas.<\u002Fb> A resposta da primeira quase sempre abre a segunda: se houver estacionamento, você pergunta o preço; se o café estiver incluído, você pergunta o horário. É a segunda pergunta que faz a ligação durar mais de trinta segundos.<\u002Fdiv>\n<span class=\"glabel\" style=\"margin-top:14px\">Onde vou ligar<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"onde_ligar\">\n<span class=\"glabel\" style=\"margin-top:8px\">Primeira pergunta<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"pergunta1\">\n<span class=\"glabel\" style=\"margin-top:8px\">Segunda pergunta<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"pergunta2\">\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">🎧<\u002Fspan><div><span class=\"sub\">Antes de começar<\u002Fspan><h2>Uma ligação inteira<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<a class=\"audio\" href=\"https://drive.google.com/file/d/1QjBITzNrgT3RpB564NvcpT_8YO5BEoBG/view\" target=\"_blank\" rel=\"noopener\"><span class=\"ic\">🎧<\u002Fspan><span class=\"ac\"><span class=\"an\">ÁUDIO B — a recepção · 50s<\u002Fspan><span class=\"ad\">Ouça uma ligação inteira, do lado de lá. Não é necessário responder ainda.<\u002Fspan><\u002Fspan><span class=\"go\">ouvir<\u002Fspan><\u002Fa>\n<div class=\"q\"><div class=\"qt\">Qual parte gerou mais insegurança?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"ins\" data-f=\"inseguranca\" value=\"Dizer por que estou ligando\"><span>Dizer por que estou ligando<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"ins\" data-f=\"inseguranca\" value=\"Fazer a pergunta\"><span>Fazer a pergunta<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"ins\" data-f=\"inseguranca\" value=\"Entender a resposta\"><span>Entender a resposta<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"ins\" data-f=\"inseguranca\" value=\"Confirmar no fim\"><span>Confirmar no fim<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">✅<\u002Fspan><div><span class=\"sub\">Critérios de avaliação<\u002Fspan><h2>O que eu vou ouvir no seu áudio de ensaio<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<p class=\"b\"><b>A escala tem quatro pontos.<\u002Fb> ✅ <i><b>Established<\u002Fb><\u002Fi> é o padrão do desafio: chegar ali significa que a tarefa está cumprida. ⭐ <i><b>Strength<\u002Fb><\u002Fi> está acima do que o desafio pede, e existe para quem já tem mais inglês na bagagem.<\u002Fp>\n<div class=\"crit\">\n<div class=\"ch\">Posição do motivo da ligação<\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">🌱 Building<\u002Fspan><span>O motivo não é declarado em nenhum momento.<\u002Fspan><\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">♻️ Growing<\u002Fspan><span>O motivo aparece depois de três ou mais frases.<\u002Fspan><\u002Fdiv>\n<div class=\"cl est\"><span class=\"lv\">✅ Established<\u002Fspan><span>O motivo aparece na primeira ou segunda frase. <em>\"Hi, I'm calling to ask about parking.\"<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"cl str\"><span class=\"lv\">⭐ Strength<\u002Fspan><span>O motivo aparece na primeira frase, acompanhado dos detalhes principais.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"crit\">\n<div class=\"ch\">Precisão da pergunta<\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">🌱 Building<\u002Fspan><span>A pergunta não delimita a informação pedida. <em>\"Information about the hotel?\"<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">♻️ Growing<\u002Fspan><span>A pergunta delimita um item, sem os dados complementares.<\u002Fspan><\u002Fdiv>\n<div class=\"cl est\"><span class=\"lv\">✅ Established<\u002Fspan><span>A pergunta delimita o item e os dados necessários. <em>\"Do you have parking, and how much is it per night?\"<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"cl str\"><span class=\"lv\">⭐ Strength<\u002Fspan><span>A pergunta delimita o item, os dados e o que virá depois.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"crit\">\n<div class=\"ch\">Presença da confirmação<\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">🌱 Building<\u002Fspan><span>Nenhuma informação é repetida.<\u002Fspan><\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">♻️ Growing<\u002Fspan><span>Há agradecimento, sem repetição da informação.<\u002Fspan><\u002Fdiv>\n<div class=\"cl est\"><span class=\"lv\">✅ Established<\u002Fspan><span>A informação principal é repetida em voz alta. <em>\"So it's twenty-five a night.\"<\u002Fem><\u002Fspan><\u002Fdiv>\n<div class=\"cl str\"><span class=\"lv\">⭐ Strength<\u002Fspan><span>A informação é repetida e serve de gancho para a segunda pergunta.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"crit\">\n<div class=\"ch\">Grau de dependência do texto escrito<\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">🌱 Building<\u002Fspan><span>Todas as frases são lidas.<\u002Fspan><\u002Fdiv>\n<div class=\"cl\"><span class=\"lv\">♻️ Growing<\u002Fspan><span>Parte das frases é lida, parte sai de memória.<\u002Fspan><\u002Fdiv>\n<div class=\"cl est\"><span class=\"lv\">✅ Established<\u002Fspan><span>Nenhuma frase é lida. Há hesitação, sem interrupção da fala.<\u002Fspan><\u002Fdiv>\n<div class=\"cl str\"><span class=\"lv\">⭐ Strength<\u002Fspan><span>Nenhuma frase é lida, e as frases se encadeiam com ritmo próprio.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"b\" style=\"margin-top:12px\">O quarto critério determina se você está pronta para ligar. Se o ensaio ainda depende do papel, a ligação também vai depender, e no telefone o texto escrito faz a fala sair travada, porque você lê em vez de conversar.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">🔍<\u002Fspan><div><span class=\"sub\">Etapa 1 de 4 · produz o quadro preenchido<\u002Fspan><h2>Observar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<p class=\"b\">Uma ligação de pergunta tem quatro momentos, sempre na mesma ordem. Nesta etapa você coleta as frases de cada um.<\u002Fp>\n<a class=\"audio\" href=\"https://drive.google.com/file/d/1Uffd8rYB-hrspqe2glzV0VAhH1y8e7zJ/view\" target=\"_blank\" rel=\"noopener\"><span class=\"ic\">🎧<\u002Fspan><span class=\"ac\"><span class=\"an\">ÁUDIO C — uma ligação inteira · 55s<\u002Fspan><span class=\"ad\">Uma pessoa liga para um restaurante para perguntar sobre opção vegetariana. Ouça quantas vezes precisar, com o quadro na frente.<\u002Fspan><\u002Fspan><span class=\"go\">ouvir<\u002Fspan><\u002Fa>\n<p class=\"b\" style=\"margin-top:12px\">A pergunta desta ligação não é a sua, e isso é de propósito. O que você coleta aqui é o <b>formato<\u002Fb> dos quatro momentos, que serve para qualquer pergunta.<\u002Fp>\n<span class=\"lbl\">Quadro 1 — os quatro momentos<\u002Fspan>\n<p class=\"b\">Anote a frase exata, em inglês, para cada momento da cena.<\u002Fp>\n<span class=\"glabel\" style=\"margin-top:12px\">Ela diz por que está ligando<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"momento1\">\n<span class=\"glabel\" style=\"margin-top:8px\">Ela faz a pergunta<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"momento2\">\n<span class=\"glabel\" style=\"margin-top:8px\">Ela repete em voz alta o que ouviu<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"momento3\">\n<span class=\"glabel\" style=\"margin-top:8px\">Ela agradece e encerra<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"momento4\">\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">💬<\u002Fspan><div><span class=\"sub\">No grupo · antes e depois<\u002Fspan><h2>O grupo<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<span class=\"lbl\" style=\"margin-top:0\">1. Antes de ligar, compartilhe o seu plano<\u002Fspan>\n<p class=\"b\">Compartilhe em inglês, com o grupo, onde você vai ligar e o que vai perguntar.<\u002Fp>\n<div class=\"quote\">I'm going to call the Hilton Morumbi and ask if they have parking and how much it is.<\u002Fdiv>\n<p class=\"b\" style=\"margin-top:11px\">Publicar o plano muda o resultado: fica mais difícil adiar quando as outras já sabem o que você combinou de fazer.<\u002Fp>\n<p class=\"b\">Leia os planos das outras. Se alguém pensou numa pergunta melhor que a sua, aproveite.<\u002Fp>\n<span class=\"lbl\">2. Depois de ligar, compartilhe a sua experiência<\u002Fspan>\n<p class=\"b\">Compartilhe em inglês, com o grupo, como foi a sua experiência.<\u002Fp>\n<div class=\"quote\">I called! They have parking, 25 euros a night. I understood almost everything.<br>I got nervous and hung up. Trying again tomorrow.<\u002Fdiv>\n<div class=\"note coral\"><b>Compartilhe também quando não der certo.<\u002Fb> Se a recepção respondeu em português, se você travou, se desligou no meio — compartilhe. Alguém do grupo ainda não ligou e tem medo exatamente disso.<\u002Fdiv>\n<span class=\"lbl\">Anote o que você quer levar para o grupo<\u002Fspan>\n<textarea class=\"fin\" data-f=\"grupo\"><\u002Ftextarea>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">✏️<\u002Fspan><div><span class=\"sub\">Etapa 2 de 4 · produz o roteiro escrito<\u002Fspan><h2>Adaptar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<div class=\"steps\">\n<div class=\"st1\"><span class=\"sn\">1<\u002Fspan><p><b>A abertura.<\u002Fb> Diga quem é e por que está ligando, em uma frase.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex1\"><span>Hi, my name is <b>Marcia<\u002Fb> — I'm calling to ask about <b>parking at the hotel<\u002Fb>.<\u002Fspan><\u002Fdiv>\n<span class=\"glabel\" style=\"margin-top:12px\">A sua abertura<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"abertura\">\n<div class=\"steps\" style=\"margin-top:14px\">\n<div class=\"st1\"><span class=\"sn\">2<\u002Fspan><p><b>As duas perguntas.<\u002Fb> Escreva as duas, na ordem em que você vai fazer.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<span class=\"glabel\" style=\"margin-top:8px\">Pergunta 1<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"adaptar_p1\">\n<span class=\"glabel\" style=\"margin-top:8px\">Pergunta 2<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"adaptar_p2\">\n<div class=\"steps\" style=\"margin-top:14px\">\n<div class=\"st1\"><span class=\"sn\">3<\u002Fspan><p><b>A confirmação.<\u002Fb> A frase que você diz antes de encerrar, repetindo o que ouviu.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex1\"><span>So it's <b>twenty-five euros a night<\u002Fb>, and it's <b>not at the hotel<\u002Fb>. Got it, thank you!<\u002Fspan><\u002Fdiv>\n<span class=\"glabel\" style=\"margin-top:12px\">A sua confirmação<\u002Fspan>\n<input class=\"fin\" type=\"text\" data-f=\"confirmacao\">\n<div class=\"steps\" style=\"margin-top:14px\">\n<div class=\"st1\"><span class=\"sn\">4<\u002Fspan><p><b>Verifique.<\u002Fb> Passe as frases pela metodologia do tradutor. <a href=\"https://www.inglessemroteiro.com.br/school/course/desafio-8-semanas/lecture/10350164\">Assista à aula aqui.<\u002Fa><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">🎧<\u002Fspan><div><span class=\"sub\">Etapa 3 de 4 · produz a ligação na memória<\u002Fspan><h2>Testar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<span class=\"lbl\" style=\"margin-top:0\">Teste 1 — a abertura em uma frase<\u002Fspan>\n<p class=\"b\">Diga a sua abertura em voz alta, cinco vezes, sem olhar o papel. É o primeiro segundo da ligação e é onde a pessoa decide se vai falar inglês com você.<\u002Fp>\n<label class=\"chk\" style=\"margin-top:10px\"><input type=\"checkbox\" data-f=\"t1\"><span>Fiz o teste 1<\u002Fspan><\u002Flabel>\n<span class=\"lbl\">Teste 2 — responder dentro do tempo<\u002Fspan>\n<p class=\"b\"><b>A cena:<\u002Fb> você ligou para o hotel e a recepção atendeu. Ela responde de forma direta, sem complicação.<\u002Fp>\n<p class=\"b\"><b>O seu papel:<\u002Fb> perguntar se há estacionamento e quanto custa por noite, usando as duas perguntas que você escreveu no Adaptar.<\u002Fp>\n<a class=\"audio\" href=\"https://drive.google.com/file/d/1QjBITzNrgT3RpB564NvcpT_8YO5BEoBG/view\" target=\"_blank\" rel=\"noopener\"><span class=\"ic\">🎧<\u002Fspan><span class=\"ac\"><span class=\"an\">ÁUDIO B — a recepção · 50s<\u002Fspan><span class=\"ad\">Responda em voz alta nas pausas.<\u002Fspan><\u002Fspan><span class=\"go\">ouvir<\u002Fspan><\u002Fa>\n<p class=\"b\" style=\"margin-top:12px\"><b>O que verificar:<\u002Fb> você conseguiu falar dentro das pausas, sem que o áudio seguisse antes de você terminar?<\u002Fp>\n<p class=\"b\">Se não deu tempo, rode de novo. As pausas têm o tamanho de uma conversa real, e é por isso que elas parecem curtas nas primeiras vezes.<\u002Fp>\n<label class=\"chk\" style=\"margin-top:10px\"><input type=\"checkbox\" data-f=\"t2\"><span>Fiz o teste 2<\u002Fspan><\u002Flabel>\n<span class=\"lbl\">Teste 3 — entender uma resposta com três informações<\u002Fspan>\n<p class=\"b\"><b>A cena:<\u002Fb> a mesma pergunta, num hotel diferente. Aqui a resposta não é sim nem não — ela traz três informações encadeadas, ditas de uma vez só, em ritmo natural.<\u002Fp>\n<p class=\"b\"><b>O seu papel:<\u002Fb> fazer as mesmas duas perguntas, e depois <b>repetir em voz alta o que você entendeu<\u002Fb>.<\u002Fp>\n<a class=\"audio\" href=\"https://drive.google.com/file/d/183Va-OJaA9yj6dLoV2mh-VXCExTj1a8p/view\" style=\"background:#348a8e\" target=\"_blank\" rel=\"noopener\"><span class=\"ic\">🎧<\u002Fspan><span class=\"ac\"><span class=\"an\">ÁUDIO B2 — a resposta completa · 55s<\u002Fspan><span class=\"ad\">A mesma pergunta, num hotel diferente. A resposta traz três informações de uma vez.<\u002Fspan><\u002Fspan><span class=\"go\">ouvir<\u002Fspan><\u002Fa>\n<p class=\"b\" style=\"margin-top:12px\">Agora confira o que você pegou. Responda sem voltar ao áudio.<\u002Fp>\n<div class=\"q\"><div class=\"qt\">1 · O estacionamento fica no hotel?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"c1\" data-f=\"c1\" value=\"Sim, atrás do hotel\"><span>Sim, atrás do hotel<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c1\" data-f=\"c1\" value=\"Não, fica a dois minutos\"><span>Não, fica a dois minutos<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c1\" data-f=\"c1\" value=\"Ela não disse\"><span>Ela não disse<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">2 · Quanto custa por noite?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"c2\" data-f=\"c2\" value=\"20 euros\"><span>€20<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c2\" data-f=\"c2\" value=\"25 euros\"><span>€25<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c2\" data-f=\"c2\" value=\"35 euros\"><span>€35<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">3 · O que os hóspedes recebem na recepção?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"c3\" data-f=\"c3\" value=\"A chave do estacionamento\"><span>A chave do estacionamento<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c3\" data-f=\"c3\" value=\"Um cartão de desconto\"><span>Um cartão de desconto<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c3\" data-f=\"c3\" value=\"Um mapa\"><span>Um mapa<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">4 · Onde se paga?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"c4\" data-f=\"c4\" value=\"Na recepção do hotel\"><span>Na recepção do hotel<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c4\" data-f=\"c4\" value=\"Na máquina do estacionamento\"><span>Na máquina do estacionamento<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"c4\" data-f=\"c4\" value=\"No check-out\"><span>No check-out<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>Respostas:<\u002Fb> 1 — não, fica a dois minutos · 2 — €25 · 3 — um cartão de desconto · 4 — na máquina do estacionamento.<\u002Fdiv>\n<p class=\"b\" style=\"margin-top:12px\"><b>Se você errou alguma, rode o áudio de novo procurando só aquela informação.<\u002Fb> Não tente entender a resposta inteira de uma vez: escolha uma informação por escuta.<\u002Fp>\n<p class=\"b\">Este é o teste que corresponde ao objetivo da semana. Numa ligação de verdade, é exatamente esse tipo de resposta que você vai receber.<\u002Fp>\n<label class=\"chk\" style=\"margin-top:10px\"><input type=\"checkbox\" data-f=\"t3\"><span>Fiz o teste 3<\u002Fspan><\u002Flabel>\n<span class=\"lbl\">Teste 4 — o ensaio completo, sem o papel<\u002Fspan>\n<p class=\"b\">Grave a sua parte da ligação, do começo ao fim, sem olhar o que você escreveu.<\u002Fp>\n<p class=\"b\"><b>Este é o áudio que você me envia.<\u002Fb> Se as frases saem sem o papel aqui, elas vão sair no telefone. Repita quantas vezes precisar até isso acontecer.<\u002Fp>\n<label class=\"chk\" style=\"margin-top:10px\"><input type=\"checkbox\" data-f=\"t4\"><span>Fiz o teste 4<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">🎙️<\u002Fspan><div><span class=\"sub\">Etapa 4 de 4 · produz a informação que você foi buscar<\u002Fspan><h2>Aplicar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<p class=\"b\"><b>Antes de ligar:<\u002Fb> tenha papel e caneta para anotar a resposta, e ligue de um lugar silencioso.<\u002Fp>\n<p class=\"b\"><b>Ligue sem o roteiro na frente.<\u002Fb> Você já preparou as frases e já gravou o ensaio sem olhar, então elas estão prontas. O papel na mão faz a fala sair travada, porque você lê em vez de conversar.<\u002Fp>\n<p class=\"b\"><b>Se a pessoa atender em holandês ou em português:<\u002Fb> <em>\"Sorry, do you speak English?\"<\u002Fem><\u002Fp>\n<p class=\"b\"><b>Se você travar:<\u002Fb> <em>\"Sorry, could you repeat that?\"<\u002Fem> ou <em>\"Could you speak a little slower, please?\"<\u002Fem> São pedidos normais, que qualquer recepção atende.<\u002Fp>\n<p class=\"b\"><b>Se der errado:<\u002Fb> compartilhe no grupo mesmo assim.<\u002Fp>\n<div class=\"note coral\"><b>📤 Até quinta:<\u002Fb> envie o áudio de ensaio no privado, com a rubrica preenchida.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">✓<\u002Fspan><div><span class=\"sub\">Antes de enviar<\u002Fspan><h2>Ouça seu áudio de ensaio e marque<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">1 · Em que momento eu disse para que liguei?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"r1\" data-f=\"r1\" value=\"🌱 Building\"><span><span class=\"em\">🌱<\u002Fspan> Não cheguei a dizer.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r1\" data-f=\"r1\" value=\"♻️ Growing\"><span><span class=\"em\">♻️<\u002Fspan> Depois de três frases ou mais.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r1\" data-f=\"r1\" value=\"✅ Established\"><span><span class=\"em\">✅<\u002Fspan> Na primeira ou segunda frase.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r1\" data-f=\"r1\" value=\"⭐ Strength\"><span><span class=\"em\">⭐<\u002Fspan> Na primeira frase, já com os detalhes.<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">2 · Minha pergunta delimitou a informação?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"r2\" data-f=\"r2\" value=\"🌱 Building\"><span><span class=\"em\">🌱<\u002Fspan> Perguntei sem dizer exatamente o quê.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r2\" data-f=\"r2\" value=\"♻️ Growing\"><span><span class=\"em\">♻️<\u002Fspan> Perguntei o item, mas sem os detalhes.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r2\" data-f=\"r2\" value=\"✅ Established\"><span><span class=\"em\">✅<\u002Fspan> Perguntei o item e os dados que eu precisava.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r2\" data-f=\"r2\" value=\"⭐ Strength\"><span><span class=\"em\">⭐<\u002Fspan> Perguntei o item, os dados e o que viria depois.<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">3 · Eu repeti a informação que ouvi?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"r3\" data-f=\"r3\" value=\"🌱 Building\"><span><span class=\"em\">🌱<\u002Fspan> Não repeti nada.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r3\" data-f=\"r3\" value=\"♻️ Growing\"><span><span class=\"em\">♻️<\u002Fspan> Agradeci, sem repetir.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r3\" data-f=\"r3\" value=\"✅ Established\"><span><span class=\"em\">✅<\u002Fspan> Repeti a informação principal em voz alta.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r3\" data-f=\"r3\" value=\"⭐ Strength\"><span><span class=\"em\">⭐<\u002Fspan> Repeti e emendei a segunda pergunta.<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"q\"><div class=\"qt\">4 · Quanto eu li?<\u002Fdiv>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"r4\" data-f=\"r4\" value=\"🌱 Building\"><span><span class=\"em\">🌱<\u002Fspan> Li todas as frases.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r4\" data-f=\"r4\" value=\"♻️ Growing\"><span><span class=\"em\">♻️<\u002Fspan> Li algumas, outras saíram de memória.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r4\" data-f=\"r4\" value=\"✅ Established\"><span><span class=\"em\">✅<\u002Fspan> Não li nenhuma. Hesitei, mas não parei.<\u002Fspan><\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"r4\" data-f=\"r4\" value=\"⭐ Strength\"><span><span class=\"em\">⭐<\u002Fspan> Não li nenhuma, e as frases se conectaram.<\u002Fspan><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<span class=\"lbl\">O que foi mais difícil?<\u002Fspan>\n<textarea class=\"fin\" data-f=\"dificuldade\"><\u002Ftextarea>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">📝<\u002Fspan><div><span class=\"sub\">Depois de ligar<\u002Fspan><h2>Para você registrar<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<span class=\"lbl\" style=\"margin-top:0\">O que você não entendeu na ligação?<\u002Fspan>\n<textarea class=\"fin\" data-f=\"nao_entendi\"><\u002Ftextarea>\n<span class=\"lbl\">O que faria diferente numa próxima?<\u002Fspan>\n<textarea class=\"fin\" data-f=\"proxima_vez\"><\u002Ftextarea>\n<p class=\"b\" style=\"margin-top:12px\"><em>Estas duas respostas não vão no grupo. Envie junto com o áudio, ou depois da ligação, porque é a partir delas que eu preparo a sua devolutiva de sexta.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">🗂️<\u002Fspan><div><span class=\"sub\">Material de apoio<\u002Fspan><h2>Kit de frases<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<div class=\"kit\"><span class=\"km\">Abrir<\u002Fspan><div class=\"kl\">Hi, my name is ___ — I'm calling to ask about ___.<br>Hi, do you speak English?<\u002Fdiv><\u002Fdiv>\n<div class=\"kit\"><span class=\"km\">Perguntar<\u002Fspan><div class=\"kl\">Do you have ___?<br>Is ___ included?<br>How much is it per night?<br>What time is ___?<\u002Fdiv><\u002Fdiv>\n<div class=\"kit\"><span class=\"km\">Quando não entender<\u002Fspan><div class=\"kl\">Sorry, could you repeat that?<br>Could you speak a little slower, please?<br>Sorry — how much was it?<\u002Fdiv><\u002Fdiv>\n<div class=\"kit\"><span class=\"km\">Confirmar e fechar<\u002Fspan><div class=\"kl\">So it's ___?<br>Not today, thank you — I just wanted to check.<br>Perfect, thank you so much!<br>That's all I needed. Have a good day!<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- TELA FINAL · NÃO ALTERAR a mecânica (caixa do áudio, envio,\n     confirmação). O texto ao redor pode mudar. -->\n<div class=\"step\">\n<div class=\"stephead\"><span class=\"n\">✓<\u002Fspan><div><span class=\"sub\">Fechamento<\u002Fspan><h2>Para concluir a semana<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<p class=\"b\">Mande o áudio de ensaio no WhatsApp e marque abaixo. Depois toque em terminar.<\u002Fp>\n<label class=\"chk\"><input type=\"checkbox\" data-f=\"audio_enviado\"><span>Já mandei o áudio de ensaio no WhatsApp<\u002Fspan><\u002Flabel>\n<div class=\"pos-envio\" id=\"pos-envio\">\n<p>Resposta registrada. Sua sequência foi atualizada.<\u002Fp>\n<a href=\"ISR%20-%20Aluna.dc.html\">Voltar ao app<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"foot\">Inglês sem Roteiro · dúvidas no grupo<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"bar\"><div class=\"inner\">\n<div class=\"prow\"><button class=\"back\" id=\"isr-back\" onclick=\"voltar()\">← Voltar<\u002Fbutton><span class=\"pnum\" id=\"isr-pnum\"><\u002Fspan><\u002Fdiv>\n<div class=\"prog\"><span class=\"pfill\" id=\"isr-pfill\"><\u002Fspan><\u002Fdiv>\n<button class=\"send\" onclick=\"avancar()\"><span id=\"isr-cta\">Continuar<\u002Fspan><\u002Fbutton>\n<div class=\"st\" id=\"status\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<script>\n// ═══ TROCAR TODA SEMANA ═══\nvar SEMANA = \"5\";\nvar TITULO = \"Semana 5 — Marcar um horário\";\n\n// ═══ NÃO ALTERAR DAQUI PARA BAIXO ═══\nvar BACKEND_PADRAO = \"https://script.google.com/macros/s/AKfycbxZeKxCvROSNSsT-rhcbHEZ7dAW_JlF3n21N7vp_SA5ByMEPcRIzRnbMmP62DV267M0/exec\";\nvar ZAPIER_PADRAO = \"https://hooks.zapier.com/hooks/catch/20567641/46hjlly/\";\nvar params = new URLSearchParams(window.location.search);\nvar BACKEND = params.get(\"b\") || BACKEND_PADRAO;\nvar ZAPIER = params.get(\"z\") || ZAPIER_PADRAO;\nvar CHAVE = \"isr_desafio_semana\" + SEMANA + \"_v1\";\nvar CAMPOS = [];\nvar tela = 0;\n\nfunction aoTopo() { var a = document.querySelector(\".app\"); if (a) a.scrollTop = 0; window.scrollTo(0, 0); }\n\nfunction telas() { return Array.prototype.slice.call(document.querySelectorAll(\".app > .step\")); }\n\nfunction pintar() {\n  var s = telas();\n  if (!s.length) return;\n  tela = Math.max(0, Math.min(tela, s.length - 1));\n  s.forEach(function (el, n) { el.style.display = n === tela ? \"\" : \"none\"; });\n  var ultima = tela === s.length - 1;\n  document.getElementById(\"isr-pfill\").style.width = ((tela + 1) / s.length * 100) + \"%\";\n  document.getElementById(\"isr-pnum\").textContent = \"Tela \" + (tela + 1) + \" de \" + s.length;\n  document.getElementById(\"isr-cta\").textContent = ultima ? \"Terminei a Semana \" + SEMANA : \"Continuar\";\n  document.getElementById(\"isr-back\").hidden = tela === 0;\n  try { localStorage.setItem(CHAVE + \"_tela\", String(tela)); } catch (e) {}\n}\n\nfunction avancar() {\n  if (tela === telas().length - 1) { enviar(); return; }\n  tela++; avisar(\"\"); pintar(); aoTopo();\n}\nfunction voltar() { tela--; avisar(\"\"); pintar(); aoTopo(); }\n\nfunction ligarCampos() {\n  CAMPOS = Array.prototype.slice.call(document.querySelectorAll(\"[data-f]\"));\n  var salvo = {};\n  try { salvo = JSON.parse(localStorage.getItem(CHAVE) || \"{}\"); } catch (e) {}\n  CAMPOS.forEach(function (el) {\n    var k = el.dataset.f;\n    if (salvo[k] === undefined) return;\n    if (el.type === \"checkbox\") el.checked = !!salvo[k];\n    else if (el.type === \"radio\") el.checked = el.value === salvo[k];\n    else el.value = salvo[k];\n  });\n  var salvar = function () {\n    try { localStorage.setItem(CHAVE, JSON.stringify(coletar())); } catch (e) {}\n  };\n  CAMPOS.forEach(function (el) {\n    el.addEventListener(\"input\", salvar);\n    el.addEventListener(\"change\", salvar);\n  });\n}\n\nfunction coletar() {\n  var out = {};\n  CAMPOS.forEach(function (el) {\n    var k = el.dataset.f;\n    if (el.type === \"checkbox\") out[k] = el.checked;\n    else if (el.type === \"radio\") { if (el.checked) out[k] = el.value; else if (out[k] === undefined) out[k] = \"\"; }\n    else out[k] = el.value;\n  });\n  return out;\n}\n\n// tudo o que tem data-f vai para a planilha, com o nome do campo\nfunction montarEnvio() {\n  var d = coletar();\n  var out = { semana: SEMANA, semana_titulo: TITULO, enviado_em: new Date().toISOString() };\n  Object.keys(d).forEach(function (k) {\n    out[k] = typeof d[k] === \"boolean\" ? (d[k] ? \"sim\" : \"não\") : String(d[k] || \"\").trim();\n  });\n  out.audio_enviado = d.audio_enviado ? \"sim\" : \"não\";\n  return out;\n}\n\nfunction avisar(msg) { document.getElementById(\"status\").textContent = msg; }\n\n// identidade: quem está logada não digita nada; sem sessão, os campos aparecem\nfunction mostrarIdentidade() {\n  var linha = document.getElementById(\"ident-linha\");\n  var campos = document.getElementById(\"ident-campos\");\n  var a = window.ISRDesafio ? ISRDesafio.aluna() : null;\n  if (a) {\n    linha.innerHTML = \"Você está fazendo o desafio como <b><\u002Fb> · \" +\n      \"<a href=\\\"aluna.html?trocar\\\">trocar de conta<\u002Fa>\";\n    linha.querySelector(\"b\").textContent = a.nome.split(\" \")[0];\n  } else {\n    linha.hidden = true;\n    campos.hidden = false;\n  }\n}\n\nfunction enviar() {\n  var campos = montarEnvio();\n  if (!campos.nome || !campos.email) {\n    avisar(\"Não achei sua identificação. Recarregue a página ou preencha nome e e-mail.\");\n    tela = 0; pintar(); aoTopo(); return;\n  }\n  if (campos.audio_enviado !== \"sim\") {\n    avisar(\"Primeiro mande o áudio no WhatsApp. Depois marque a caixa acima e envie.\");\n    return;\n  }\n  var botao = document.getElementById(\"isr-cta\").parentElement;\n  botao.disabled = true;\n  avisar(\"Enviando…\");\n\n  // registra a resposta no sistema: atualiza a sequência (streak),\n  // o ranque e as miles da aluna logada\n  try { if (window.ISRDesafio) ISRDesafio.registrar(\"Concluído pela página do desafio\"); } catch (e) {}\n\n  if (ZAPIER) {\n    try {\n      fetch(ZAPIER, { method: \"POST\", mode: \"no-cors\",\n        body: new URLSearchParams(campos) }).catch(function () {});\n    } catch (e) {}\n  }\n\n  var fim = function (msg, deuCerto) {\n    avisar(msg); botao.disabled = false;\n    if (deuCerto) document.getElementById(\"pos-envio\").style.display = \"block\";\n  };\n\n  if (BACKEND) {\n    fetch(BACKEND, { method: \"POST\",\n      headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n      body: JSON.stringify(Object.assign({ action: \"novaAtividade\" }, campos)) })\n      .then(function (r) { return r.json(); })\n      .then(function (d) {\n        if (d && d.ok) fim(\"Semana \" + SEMANA + \" concluída.\", true);\n        else fim(\"O registro não foi aceito (\" + ((d && d.error) || \"erro\") + \"). Tente de novo.\");\n      })\n      .catch(function () {\n        fim(\"O envio não completou. Verifique a conexão e tente de novo.\");\n      });\n  } else if (ZAPIER) {\n    fim(\"Semana \" + SEMANA + \" concluída.\", true);\n  } else {\n    fim(\"Este link está sem o endereço de envio. Avise a escola.\");\n  }\n}\n\nligarCampos();\nmostrarIdentidade();\ntry { tela = parseInt(localStorage.getItem(CHAVE + \"_tela\") || \"0\", 10) || 0; } catch (e) {}\npintar();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
