<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo A · A aula no centro</title>
<!--
  MODELO A — A AULA NO CENTRO
  Protótipo clicável. Dados inventados. Não entra no sistema.

  A IDEIA: a unidade de navegação é UMA AULA. A professora escolhe a
  aula na faixa de datas e tem, numa rolagem só, tudo o que ela faz
  com aquela aula — antes, durante e depois, nessa ordem: o plano e os
  slides, o caderno ao vivo, a chamada, e as tarefas entregues.

  O que ganha: dar uma aula é uma tela e zero troca de lugar.
  O que custa: a tela da aula é longa, e o que não é aula (clube,
  particular, horas) fica um nível abaixo.

  Contém os 16 blocos de O-QUE-A-PROFESSORA-PRECISA.md § 9 — os mesmos
  nos três.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="professora-modelo.css" />
</head>
<body>
<div id="faixa"></div>
<div class="tela">
  <aside class="lado">
    <div class="marca">Inglês sem Roteiro</div>
    <div class="quem"><div class="bolha">B</div>
      <div><div style="font-weight:700;font-size:14px">Bárbara</div>
        <div style="font-size:11.5px;opacity:.75">professora</div></div></div>
    <nav id="menu" style="display:flex;flex-direction:column;gap:3px"></nav>
  </aside>
  <main class="corpo" id="corpo"></main>
</div>

<script src="professora-modelo-dados.js"></script>
<script src="professora-modelo-blocos.js"></script>
<script src="professora-modelo-shell.js"></script>
<script>
(function () {
  "use strict";
  var D = window.ISR_MODELO, B = window.ISR_BLOCOS, S = window.ISR_SHELL;
  document.getElementById("faixa").innerHTML = S.faixa("A", "a aula no centro");

  // as telas que, no modelo A, são a MESMA tela da aula
  var DA_AULA = ["aula", "plano", "chamada", "conteudo", "aulaViva"];

  S.iniciar({
    telaDaAula: "aula",
    inicial: { tela: "hoje", turma: "basics", data: "2026-11-16",
      abaTurma: "geral", abaClube: "pagina", clube: "movie",
      cadFiltro: "por_corrigir", vivoFiltro: "todas", vivoAluna: "" },

    menu: function (est) {
      var naAula = DA_AULA.indexOf(est.tela) >= 0;
      var corrigir = D.porCorrigir().length;
      var semGrav = D.semGravacao().length;
      return [
        { itens: [
          { label: "Hoje", on: est.tela === "hoje", vai: { tela: "hoje" } },
          { label: "A aula", on: naAula, pino: D.VIVO.aberta ? "ao vivo" : "",
            vai: { tela: "aula", turma: "basics", data: "2026-11-16", vivoAluna: "" } }
        ] },
        { titulo: "depois da aula", itens: [
          { label: "Cadernos", on: est.tela === "cadernos", pino: corrigir ? String(corrigir) : "",
            vai: { tela: "cadernos" } },
          { label: "Gravações", on: est.tela === "gravacoes", pino: semGrav ? String(semGrav) : "",
            vai: { tela: "gravacoes" } }
        ] },
        { titulo: "turmas e grupos", itens: [
          { label: "Turmas", on: est.tela === "turmas" || est.tela === "turma", vai: { tela: "turmas" } },
          { label: "Alunas", on: est.tela === "alunas" || est.tela === "pulso", vai: { tela: "alunas" } },
          { label: "Clubes", on: est.tela === "clubes" || est.tela === "clube", vai: { tela: "clubes" } },
          { label: "Particulares", on: est.tela === "particulares" || est.tela === "particular", vai: { tela: "particulares" } }
        ] },
        { titulo: "eu", itens: [
          { label: "Aulas do mês", on: est.tela === "horas", vai: { tela: "horas" } },
          { label: "Substituição", on: est.tela === "substituir", vai: { tela: "substituir" } }
        ] }
      ];
    },

    render: function (est) {
      var t = D.turma(est.turma), a = D.aula(est.turma, est.data);

      if (DA_AULA.indexOf(est.tela) >= 0) {
        // A TELA DA AULA: uma rolagem, na ordem do dia.
        var h = [];
        h.push('<div class="tira">');
        D.SEMANA.forEach(function (s) {
          if (s.clube) {
            h.push('<button class="dia" ' + B.ir({ tela: "clube", clube: s.turma, abaClube: "encontros" })
              + "><b>" + B.esc(s.curto) + "</b><span>" + B.esc(s.rotulo) + "</span></button>");
            return;
          }
          var on = s.turma === est.turma && s.data === est.data;
          h.push('<button class="dia' + (on ? " on" : "") + '" '
            + B.ir({ tela: "aula", turma: s.turma, data: s.data, vivoAluna: "" })
            + "><b>" + B.esc(s.curto) + "</b><span>" + B.esc(s.rotulo) + "</span></button>");
        });
        h.push("</div>");

        // Com a aula ABERTA, "durante" vem primeiro: a ordem do dia é
        // a do momento, e deixar o material de preparo entre ela e o
        // caderno ao vivo punha a grade a 2.200 px do topo.
        if (D.VIVO.aberta) {
          h.push('<div class="rotulo" style="margin-top:4px">agora · durante a aula</div>');
          h.push(B.aulaViva(est));
          h.push(B.chamada(est));
          h.push('<div class="rotulo" style="margin-top:18px">o plano desta sessão</div>');
          h.push(B.plano(est));
          h.push(B.conteudo(est));
        } else {
          h.push('<div class="rotulo" style="margin-top:4px">1 · antes da aula</div>');
          h.push(B.plano(est));
          h.push(B.conteudo(est));
          h.push('<div class="rotulo" style="margin-top:18px">2 · durante a aula</div>');
          h.push(B.aulaViva(est));
          h.push(B.chamada(est));
        }
        h.push('<div class="rotulo" style="margin-top:18px">depois da aula</div>');
        h.push('<section class="cartao">' + B.cab("As tarefas desta turma", "",
          '<button class="btn claro pq" ' + B.ir({ tela: "cadernos", cadFiltro: "todas" }) + ">Abrir os cadernos</button>"));
        var meus = D.CADERNO.filter(function (c) { return c.turma === t.id; });
        if (!meus.length) h.push('<div class="nota">Nada entregue nesta turma ainda.</div>');
        meus.forEach(function (c) {
          h.push('<div class="linha"><span class="nome">' + B.esc(c.aluna) + "</span>"
            + '<span class="nota" style="margin:0;flex:1">sessão ' + c.sessao + " · " + B.esc(c.titulo) + "</span>"
            + '<span class="selo ' + (c.corrigido ? "ok" : "alerta") + '">'
            + (c.corrigido ? "corrigida" : "por corrigir") + "</span></div>");
        });
        h.push("</section>");

        return { olho: t.dia + " · " + (a.curto === "hoje" ? "16 de novembro" : a.curto),
          titulo: t.nivel + " · sessão " + a.s,
          sub: a.titulo + " · " + t.alunas.length + " alunas · " + t.modalidade,
          html: h.join("") };
      }

      if (est.tela === "hoje") return { olho: "segunda, 16 de novembro",
        titulo: "Hoje", sub: "A próxima aula, a agenda e a fila.", html: B.hoje(est) };
      if (est.tela === "cadernos") return { olho: "depois da aula",
        titulo: "Cadernos", sub: "O que elas escreveram, para ler e corrigir fora da aula.", html: B.cadernos(est) };
      if (est.tela === "gravacoes") return { olho: "depois da aula",
        titulo: "Gravações", sub: "Uma por aula dada, visível só para as alunas da turma.", html: B.gravacoes(est) };
      if (est.tela === "turmas") return { olho: "turmas e grupos",
        titulo: "Turmas", sub: "", html: B.turmas(est) };
      if (est.tela === "turma") return { olho: "turmas",
        titulo: t.nivel + " · " + t.quando, sub: t.projeto, html: B.turma(est) };
      if (est.tela === "clubes") return { olho: "turmas e grupos",
        titulo: "Clubes", sub: "", html: B.clubes(est) };
      if (est.tela === "clube") return { olho: "clubes",
        titulo: D.clube(est.clube).nome, sub: D.clube(est.clube).quando, html: B.clube(est) };
      if (est.tela === "particulares") return { olho: "turmas e grupos",
        titulo: "Particulares", sub: "", html: B.particulares(est) };
      if (est.tela === "particular") return { olho: "particulares",
        titulo: est.particular, sub: "", html: B.particular(est) };
      if (est.tela === "horas") return { olho: "eu",
        titulo: "Aulas do mês", sub: "", html: B.horas(est) };
      if (est.tela === "substituir") return { olho: "eu",
        titulo: "Substituição", sub: "", html: B.substituir(est) };
      if (est.tela === "alunas") return { olho: "turmas e grupos",
        titulo: "Alunas", sub: "Faltas, entregas e o caderno de cada uma.", html: B.alunas(est) };
      if (est.tela === "pulso") return { olho: "a ficha da aluna",
        titulo: est.aluna, sub: "", html: B.pulso(est) };
      return { titulo: "—", html: "" };
    }
  });
})();
</script>
</body>
</html>
