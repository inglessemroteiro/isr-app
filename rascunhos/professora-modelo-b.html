<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo B · Uma coisa por item</title>
<!--
  MODELO B — UMA COISA POR ITEM
  Protótipo clicável. Dados inventados. Não entra no sistema.

  A IDEIA: cada tarefa tem o seu lugar no menu, e cada tela faz uma
  coisa. Nada empilhado. Quem sabe o que quer chega em um clique.

  O que ganha: o caminho mais curto para UMA tarefa, e telas curtas.
  O que custa: dar uma aula é trocar de item quatro vezes, e cada
  tela precisa perguntar de novo "qual turma, qual dia" — o seletor
  no alto de Plano, Caderno ao vivo, Chamada e Slides é esse preço.

  Contém os 16 blocos de O-QUE-A-PROFESSORA-PRECISA.md § 9 — os mesmos
  nos três.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="professora-modelo.css" />
</head>
<body>
<div id="faixa"></div>
<div class="tela">
  <aside class="lado">
    <div class="marca">Inglês sem Roteiro</div>
    <div class="quem"><div class="bolha">B</div>
      <div><div style="font-weight:700;font-size:14px">Bárbara</div>
        <div style="font-size:11.5px;opacity:.75">professora</div></div></div>
    <nav id="menu" style="display:flex;flex-direction:column;gap:3px"></nav>
  </aside>
  <main class="corpo" id="corpo"></main>
</div>

<script src="professora-modelo-dados.js"></script>
<script src="professora-modelo-blocos.js"></script>
<script src="professora-modelo-shell.js"></script>
<script>
(function () {
  "use strict";
  var D = window.ISR_MODELO, B = window.ISR_BLOCOS, S = window.ISR_SHELL;
  document.getElementById("faixa").innerHTML = S.faixa("B", "uma coisa por item");

  // O seletor que cada tela de aula precisa repetir, porque neste
  // modelo a aula não é um lugar: é um parâmetro.
  function seletor(est) {
    var h = ['<div class="cartao" style="padding:12px 15px;margin-bottom:13px">'
      + '<div class="rotulo">qual turma e qual dia</div><div class="tira" style="margin:7px 0 0">'];
    D.SEMANA.filter(function (s) { return !s.clube; }).forEach(function (s) {
      var on = s.turma === est.turma && s.data === est.data;
      h.push('<button class="chip' + (on ? " on" : "") + '" '
        + B.ir({ turma: s.turma, data: s.data, vivoAluna: "" }) + ">"
        + B.esc(s.curto + " · " + s.rotulo) + "</button>");
    });
    return h.join("") + "</div></div>";
  }

  S.iniciar({
    telaDaAula: "vivo",
    inicial: { tela: "hoje", turma: "basics", data: "2026-11-16",
      abaTurma: "geral", abaClube: "pagina", clube: "movie",
      cadFiltro: "por_corrigir", vivoFiltro: "todas", vivoAluna: "" },

    menu: function (est) {
      var corrigir = D.porCorrigir().length, semGrav = D.semGravacao().length;
      return [
        { itens: [{ label: "Hoje", on: est.tela === "hoje", vai: { tela: "hoje" } }] },
        { titulo: "ensinar", itens: [
          { label: "Plano e caderno", on: est.tela === "plano" || est.tela === "conteudo",
            vai: { tela: "plano" } },
          { label: "Caderno ao vivo", on: est.tela === "vivo", pino: D.VIVO.aberta ? "ao vivo" : "",
            vai: { tela: "vivo" } },
          { label: "Chamada", on: est.tela === "chamada", vai: { tela: "chamada" } }
        ] },
        { titulo: "corrigir", itens: [
          { label: "Tarefas entregues", on: est.tela === "cadernos",
            pino: corrigir ? String(corrigir) : "", vai: { tela: "cadernos" } },
          { label: "Gravações", on: est.tela === "gravacoes",
            pino: semGrav ? String(semGrav) : "", vai: { tela: "gravacoes" } },
        ] },
        { titulo: "as alunas", itens: [
          { label: "Alunas", on: est.tela === "pulsos" || est.tela === "pulso",
            vai: { tela: "pulsos" } }
        ] },
        { titulo: "turmas e grupos", itens: [
          { label: "Turmas", on: est.tela === "turmas" || est.tela === "turma", vai: { tela: "turmas" } },
          { label: "Clubes", on: est.tela === "clubes" || est.tela === "clube", vai: { tela: "clubes" } },
          { label: "Particulares", on: est.tela === "particulares" || est.tela === "particular",
            vai: { tela: "particulares" } }
        ] },
        { titulo: "eu", itens: [
          { label: "Aulas do mês", on: est.tela === "horas", vai: { tela: "horas" } },
          { label: "Substituição", on: est.tela === "substituir", vai: { tela: "substituir" } }
        ] }
      ];
    },

    render: function (est) {
      var t = D.turma(est.turma), a = D.aula(est.turma, est.data);
      var ondeEstou = t.nivel + " · " + (a.curto === "hoje" ? "hoje" : a.curto) + " · sessão " + a.s;

      if (est.tela === "hoje") return { olho: "segunda, 16 de novembro",
        titulo: "Hoje", sub: "A próxima aula, a agenda e a fila.", html: B.hoje(est) };

      // O caderno da aluna mora AQUI, e não numa tela à parte: o que
      // ela abre na aula é o plano desta sessão visto do lado dela.
      // A tela de slides deixou de existir neste modelo; o link ficou
      // como um campo no fim do plano.
      if (est.tela === "plano" || est.tela === "conteudo") return { olho: "ensinar · " + ondeEstou,
        titulo: "Plano das aulas",
        sub: "O roteiro, a tarefa de casa e o caderno que a aluna abre.",
        html: seletor(est) + B.plano(est, { comCaderno: true }) };

      if (est.tela === "vivo") return { olho: "ensinar · " + ondeEstou,
        titulo: "Caderno ao vivo", sub: "O que cada aluna está escrevendo agora, e a sua correção.",
        html: seletor(est) + B.aulaViva(est) };

      if (est.tela === "chamada") return { olho: "ensinar · " + ondeEstou,
        titulo: "Chamada", sub: "Presenças, entrega da tarefa, tópico da aula e gravação.",
        html: seletor(est) + B.chamada(est) };

      if (est.tela === "cadernos") return { olho: "corrigir",
        titulo: "Tarefas entregues", sub: "O que elas escreveram, para ler fora da aula.", html: B.cadernos(est) };

      if (est.tela === "gravacoes") return { olho: "corrigir",
        titulo: "Gravações", sub: "Uma por aula dada, visível só para as alunas da turma.", html: B.gravacoes(est) };

      if (est.tela === "pulsos") return { olho: "as alunas", titulo: "Alunas",
        sub: "Faltas, entregas e o caderno de cada uma.", html: B.alunas(est) };

      if (est.tela === "turmas") return { olho: "turmas e grupos",
        titulo: "Turmas", sub: "", html: B.turmas(est) };
      if (est.tela === "turma") return { olho: "turmas",
        titulo: t.nivel + " · " + t.quando, sub: t.projeto, html: B.turma(est) };
      if (est.tela === "clubes") return { olho: "turmas e grupos",
        titulo: "Clubes", sub: "", html: B.clubes(est) };
      if (est.tela === "clube") return { olho: "clubes",
        titulo: D.clube(est.clube).nome, sub: D.clube(est.clube).quando, html: B.clube(est) };
      if (est.tela === "particulares") return { olho: "turmas e grupos",
        titulo: "Particulares", sub: "", html: B.particulares(est) };
      if (est.tela === "particular") return { olho: "particulares",
        titulo: est.particular, sub: "", html: B.particular(est) };
      if (est.tela === "horas") return { olho: "eu",
        titulo: "Aulas do mês", sub: "", html: B.horas(est) };
      if (est.tela === "substituir") return { olho: "eu",
        titulo: "Substituição", sub: "", html: B.substituir(est) };
      if (est.tela === "pulso") return { olho: "alunas",
        titulo: est.aluna, sub: "", html: B.pulso(est) };
      return { titulo: "—", html: "" };
    }
  });
})();
</script>
</body>
</html>
