<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo B · O menu da professora</title>
<!--
  MODELO B — O MENU DA PROFESSORA
  Protótipo clicável. Dados inventados. Não entra no sistema.

  A IDEIA: hoje a professora tem UM item no menu, e tudo o mais fica
  atrás de links dentro de telas que ela não abre. Daí "não consigo
  achar": não é que não exista, é que não tem nome nem lugar.

  Este modelo não inventa tela nenhuma. Dá nome e lugar ao que já
  existe: cada coisa que ela faz vira um item do menu dela, filtrado
  para as turmas dela.

  Telas: Hoje, Minhas turmas, Uma turma, Plano das aulas, Tarefas de
  casa, Gravações, Meus clubes, Um clube.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="professora-modelo.css" />
</head>
<body>
<div class="faixa">
  <b>Modelo B</b> · o menu da professora — protótipo para escolher, com dados inventados
  <a href="professora-modelo-a.html">ver o modelo A →</a>
  <a href="professora-modelo-c.html">ver o modelo C →</a>
</div>
<div class="tela">
  <aside class="lado">
    <div class="marca">Inglês sem Roteiro</div>
    <div class="quem"><div class="bolha">B</div>
      <div><div style="font-weight:700;font-size:14px">Bárbara</div>
        <div style="font-size:11.5px;opacity:.75">professora</div></div></div>
    <nav id="menu"></nav>
  </aside>
  <main class="corpo" id="corpo"></main>
</div>

<script src="professora-modelo-dados.js"></script>
<script>
(function () {
  "use strict";
  var D = window.ISR_MODELO;
  var corpo = document.getElementById("corpo");
  var menu = document.getElementById("menu");
  var est = { tela: "hoje", turma: "basics", abaTurma: "aulas", plano: "basics" };

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function ir(patch) { Object.assign(est, patch); pintar(); window.scrollTo(0, 0); }

  var MENU = [
    { g: "o meu dia" },
    { id: "hoje", label: "Hoje", pino: function () { return 1; } },
    { g: "as minhas aulas" },
    { id: "turmas", label: "Minhas turmas" },
    { id: "plano", label: "Plano das aulas" },
    { id: "tarefas", label: "Tarefas de casa", pino: function () { return D.semTarefa().length; } },
    { id: "gravacoes", label: "Gravações", pino: function () { return D.semGravacao().length; } },
    { g: "comunidade" },
    { id: "clubes", label: "Meus clubes" }
  ];

  function pintarMenu() {
    menu.innerHTML = "";
    MENU.forEach(function (m) {
      if (m.g) {
        var g = document.createElement("div");
        g.className = "grupo"; g.textContent = m.g; menu.appendChild(g); return;
      }
      var atual = est.tela === m.id || (m.id === "turmas" && est.tela === "turma")
        || (m.id === "clubes" && est.tela === "clube");
      var b = document.createElement("button");
      b.className = "item" + (atual ? " on" : "");
      var n = m.pino ? m.pino() : 0;
      b.innerHTML = "<span>" + esc(m.label) + "</span>"
        + (n ? '<span class="pino">' + n + "</span>" : "");
      b.onclick = function () { ir({ tela: m.id }); };
      menu.appendChild(b);
    });
  }

  // ── HOJE ──────────────────────────────────────────────────────
  function telaHoje() {
    var t = D.turma("basics"), a = D.aula("basics", "2026-11-16");
    var h = ['<div class="olho">segunda-feira, 16 de novembro</div><h1>Hoje</h1>',
      '<div class="intro">A aula de hoje e o que ficou pendente nas outras turmas. Cada bloco leva à tela onde se resolve.</div>'];

    h.push('<section class="cartao"><div class="cab">'
      + "<div><h2>" + esc(t.nivel) + " · " + esc(t.quando) + "</h2>"
      + '<div class="sub">Sessão ' + a.s + " · " + esc(a.titulo) + " · " + t.alunas.length + " alunas</div></div>"
      + '<span class="selo alerta">chamada aberta</span></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'
      + '<button class="btn pq" data-go="turma">Abrir a aula</button>'
      + '<button class="btn claro pq" data-go="tarefas">Tarefa de casa</button>'
      + "</div></section>");

    var sg = D.semGravacao(), st = D.semTarefa();
    h.push('<section class="cartao"><div class="cab"><h2>O que está pendente</h2></div>');
    h.push('<div class="linha"><span class="nome">Aulas sem gravação publicada</span>'
      + '<span class="selo ' + (sg.length ? "alerta" : "ok") + '">' + sg.length + "</span>"
      + '<button class="tar" data-go="gravacoes">abrir</button></div>');
    h.push('<div class="linha"><span class="nome">Aulas sem tarefa escrita</span>'
      + '<span class="selo ' + (st.length ? "alerta" : "ok") + '">' + st.length + "</span>"
      + '<button class="tar" data-go="tarefas">abrir</button></div>');
    h.push('<div class="linha"><span class="nome">Chamadas de clube pendentes</span>'
      + '<span class="selo alerta">1</span>'
      + '<button class="tar" data-go="clubes">abrir</button></div>');
    h.push("</section>");

    h.push('<section class="cartao"><div class="cab"><h2>A minha semana</h2></div>');
    D.SEMANA.forEach(function (s) {
      h.push('<div class="linha"><span class="data">' + esc(s.curto) + "</span>"
        + '<span class="nome">' + esc(s.rotulo) + "</span>"
        + '<span class="selo ' + (s.hoje ? "alerta" : (s.passada ? "ok" : "neutro")) + '">'
        + (s.hoje ? "hoje" : (s.passada ? "dada" : "agendada")) + "</span></div>");
    });
    h.push("</section>");
    corpo.innerHTML = h.join("");
    ligarGo();
  }

  // ── MINHAS TURMAS ─────────────────────────────────────────────
  function telaTurmas() {
    var h = ['<div class="olho">as minhas aulas</div><h1>Minhas turmas</h1>',
      '<div class="intro">As turmas deste ciclo. Toque numa para ver as aulas, as alunas e o material.</div>',
      '<section class="cartao"><table><thead><tr><th>Turma</th><th>Projeto</th><th>Alunas</th><th>Onde</th><th></th></tr></thead><tbody>'];
    D.TURMAS.forEach(function (t) {
      h.push("<tr><td><div class='turminha'>" + esc(t.nivel) + "</div><div class='sub'>" + esc(t.quando) + "</div></td>"
        + "<td>" + esc(t.projeto) + "<div class='sub'>sessão " + t.sessao + " de " + t.sessoes + "</div></td>"
        + "<td>" + t.alunas.length + "</td>"
        + "<td>" + esc(t.modalidade) + (t.local ? "<div class='sub'>" + esc(t.local) + "</div>" : "") + "</td>"
        + "<td style='text-align:right'><button class='btn claro pq' data-turma='" + t.id + "'>Abrir</button></td></tr>");
    });
    h.push("</tbody></table></section>");
    corpo.innerHTML = h.join("");
    [].forEach.call(corpo.querySelectorAll("[data-turma]"), function (el) {
      el.onclick = function () { ir({ tela: "turma", turma: el.getAttribute("data-turma"), abaTurma: "aulas" }); };
    });
  }

  function telaTurma() {
    var t = D.turma(est.turma);
    var h = ['<div class="olho">minha turma</div><h1>' + esc(t.nivel) + " · " + esc(t.quando) + "</h1>",
      '<div class="sub1">' + esc(t.projeto) + " · sessão " + t.sessao + " de " + t.sessoes
      + " · " + t.alunas.length + " alunas · " + esc(t.modalidade) + (t.local ? " · " + esc(t.local) : "") + "</div>"];
    var abas = [["aulas", "Aulas"], ["alunas", "Alunas"], ["materiais", "Materiais"]];
    h.push('<div class="abas">' + abas.map(function (x) {
      return '<button class="aba' + (est.abaTurma === x[0] ? " on" : "") + '" data-aba="' + x[0] + '">' + x[1] + "</button>";
    }).join("") + "</div>");
    if (est.abaTurma === "aulas") {
      h.push('<section class="cartao liso">');
      t.aulas.forEach(function (a) {
        h.push('<div class="aulaLinha"><div class="topo">'
          + '<span class="data">' + esc(a.curto) + "</span>"
          + '<span class="tit">Sessão ' + a.s + " · " + esc(a.titulo)
          + "<span>" + esc(a.topico || "sem tópico") + "</span></span>"
          + (a.estado === "agendada" ? '<span class="selo neutro">agendada</span>'
            : '<span class="selo ok">chamada feita</span>') + "</div></div>");
      });
      h.push("</section>");
      h.push('<div class="nota">A tarefa e a gravação de cada aula ficam nas telas "Tarefas de casa" e "Gravações", no menu.</div>');
    } else if (est.abaTurma === "alunas") {
      h.push('<section class="cartao">');
      t.alunas.forEach(function (n) {
        h.push('<div class="linha"><span class="nome">' + esc(n) + "</span>"
          + '<span class="selo neutro">frequência 92%</span></div>');
      });
      h.push("</section>");
    } else {
      h.push('<section class="cartao"><div class="rotulo">caderno da turma</div>'
        + '<div style="font-size:13.5px">' + esc(t.material) + "</div></section>");
    }
    corpo.innerHTML = h.join("");
    [].forEach.call(corpo.querySelectorAll("[data-aba]"), function (el) {
      el.onclick = function () { ir({ abaTurma: el.getAttribute("data-aba") }); };
    });
  }

  // ── PLANO DAS AULAS ───────────────────────────────────────────
  function telaPlano() {
    var t = D.turma(est.plano);
    var h = ['<div class="olho">as minhas aulas</div><h1>Plano das aulas</h1>',
      '<div class="intro">As sessões do programa que cada turma segue. Aqui você vê o que vem pela frente e ajusta o objetivo e as palavras de cada sessão.</div>',
      '<div class="abas">' + D.TURMAS.map(function (x) {
        return '<button class="aba' + (est.plano === x.id ? " on" : "") + '" data-p="' + x.id + '">'
          + esc(x.nivel) + "</button>"; }).join("") + "</div>",
      '<section class="cartao"><table><tbody>'];
    for (var i = 1; i <= t.sessoes; i++) {
      var a = (t.aulas || []).filter(function (x) { return x.s === i; })[0];
      h.push("<tr><td style='width:60px'><b>S" + i + "</b></td>"
        + "<td>" + esc(a ? a.titulo : "—") + "<div class='sub'>" + (a ? esc(a.curto) : "sem data") + "</div></td>"
        + "<td style='width:140px'>" + (a && a.tarefa ? '<span class="selo ok">tarefa escrita</span>'
          : '<span class="selo neutro">sem tarefa</span>') + "</td></tr>");
    }
    h.push("</tbody></table></section>");
    corpo.innerHTML = h.join("");
    [].forEach.call(corpo.querySelectorAll("[data-p]"), function (el) {
      el.onclick = function () { ir({ plano: el.getAttribute("data-p") }); };
    });
  }

  // ── TAREFAS DE CASA ───────────────────────────────────────────
  function telaTarefas() {
    var h = ['<div class="olho">as minhas aulas</div><h1>Tarefas de casa</h1>',
      '<div class="intro">Uma linha por aula das suas turmas. Aqui você escreve a tarefa, vê quem entregou e cobra quem falta. A tarefa aparece no caderno da aluna assim que for salva.</div>',
      '<section class="cartao"><table><thead><tr><th style="width:26%">Aula</th><th style="width:40%">Tarefa</th><th style="width:20%">Entregas</th><th></th></tr></thead><tbody>'];
    var todas = [];
    D.TURMAS.forEach(function (t) {
      (t.aulas || []).forEach(function (a) { if (a.estado !== "agendada" || a.hora) todas.push({ t: t, a: a }); });
    });
    todas.sort(function (x, y) { return x.a.data < y.a.data ? 1 : -1; });
    todas.forEach(function (x) {
      var ent = (x.a.entregues || []).length, tot = x.t.alunas.length;
      var falta = x.t.alunas.filter(function (n) { return (x.a.entregues || []).indexOf(n) < 0; });
      h.push("<tr><td><div class='turminha'>" + esc(x.t.nivel) + "</div>"
        + "<div class='sub'>" + esc(x.a.curto) + " · sessão " + x.a.s + "</div></td>"
        + "<td>" + (x.a.tarefa
          ? "<div style='line-height:1.5'>" + esc(x.a.tarefa) + "</div>"
          : "<input class='campo' placeholder='Escrever a tarefa desta aula…' />") + "</td>"
        + "<td>" + (x.a.tarefa
          ? '<span class="selo ' + (ent === tot ? "ok" : "alerta") + '">' + ent + " de " + tot + "</span>"
            + (falta.length ? "<div class='sub'>faltam " + esc(falta.map(function (n) { return n.split(" ")[0]; }).join(", ")) + "</div>" : "")
          : '<span class="selo erro">sem tarefa</span>') + "</td>"
        + "<td style='text-align:right'><button class='btn" + (x.a.tarefa ? " claro" : "") + " pq'>"
        + (x.a.tarefa ? "Editar" : "Salvar") + "</button></td></tr>");
    });
    h.push("</tbody></table></section>");
    corpo.innerHTML = h.join("");
  }

  // ── GRAVAÇÕES ─────────────────────────────────────────────────
  function telaGravacoes() {
    var h = ['<div class="olho">as minhas aulas</div><h1>Gravações</h1>',
      '<div class="intro">As suas aulas já dadas. Cole o link do Drive na aula; a gravação aparece no caderno só para as alunas daquela turma.</div>',
      '<section class="cartao"><table><thead><tr><th style="width:28%">Aula</th><th style="width:46%">Link</th><th></th></tr></thead><tbody>'];
    D.aulasDadas().forEach(function (x) {
      h.push("<tr><td><div class='turminha'>" + esc(x.turma.nivel) + "</div>"
        + "<div class='sub'>" + esc(x.aula.curto) + " · sessão " + x.aula.s + "</div></td>"
        + "<td>" + (x.aula.gravacao
          ? "<div class='sub' style='font-size:12.5px'>" + esc(x.aula.gravacao) + "</div>"
          : "<input class='campo' placeholder='Colar o link do Drive…' />") + "</td>"
        + "<td style='text-align:right'>" + (x.aula.gravacao
          ? '<span class="selo ok">publicada</span>'
          : '<button class="btn pq">Publicar</button>') + "</td></tr>");
    });
    h.push("</tbody></table></section>");
    corpo.innerHTML = h.join("");
  }

  // ── CLUBES ────────────────────────────────────────────────────
  function telaClubes() {
    var h = ['<div class="olho">comunidade</div><h1>Meus clubes</h1>'];
    D.CLUBES.forEach(function (c) {
      h.push('<section class="cartao"><div class="cab">'
        + "<div><h2>" + esc(c.emoji + " " + c.nome) + "</h2>"
        + '<div class="sub">' + esc(c.quando) + " · " + esc(c.nivel) + " · " + c.inscritas + " de " + c.vagas + "</div></div>"
        + '<button class="btn claro pq" data-c="' + c.id + '">Abrir</button></div></section>');
    });
    corpo.innerHTML = h.join("");
    [].forEach.call(corpo.querySelectorAll("[data-c]"), function (el) {
      el.onclick = function () { ir({ tela: "clube" }); };
    });
  }
  function telaClube() {
    var c = D.CLUBES[0];
    var h = ['<div class="olho">meu clube</div><h1>' + esc(c.emoji + " " + c.nome) + "</h1>",
      '<div class="sub1">' + esc(c.quando) + " · " + c.inscritas + " de " + c.vagas + " inscritas</div>",
      '<section class="cartao liso">'];
    c.encontros.forEach(function (e) {
      h.push('<div class="aulaLinha"><div class="topo"><span class="data">' + esc(e.curto) + "</span>"
        + '<span class="tit">' + esc(e.tema) + "</span>"
        + '<span class="selo ' + (/presentes/.test(e.estado) ? "ok" : "alerta") + '">' + esc(e.estado) + "</span></div></div>");
    });
    h.push("</section>");
    h.push('<section class="cartao"><div class="cab"><h2>Fórum do clube</h2></div>');
    c.forum.forEach(function (f) {
      h.push('<div class="linha" style="align-items:flex-start"><span class="nome">' + esc(f.quem)
        + '<div class="sub">' + esc(f.texto) + "</div></span>"
        + '<span class="sub" style="flex:none">' + esc(f.quando) + "</span></div>");
    });
    h.push("</section>");
    corpo.innerHTML = h.join("");
  }

  function ligarGo() {
    [].forEach.call(corpo.querySelectorAll("[data-go]"), function (el) {
      el.onclick = function () {
        var d = el.getAttribute("data-go");
        if (d === "turma") ir({ tela: "turma", turma: "basics", abaTurma: "aulas" });
        else ir({ tela: d });
      };
    });
  }

  function pintar() {
    pintarMenu();
    ({ hoje: telaHoje, turmas: telaTurmas, turma: telaTurma, plano: telaPlano,
       tarefas: telaTarefas, gravacoes: telaGravacoes, clubes: telaClubes, clube: telaClube
    }[est.tela] || telaHoje)();
  }
  pintar();
})();
</script>
</body>
</html>
