<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo C · Duas superfícies</title>
<!--
  MODELO C — DUAS SUPERFÍCIES
  Protótipo clicável. Dados inventados. Não entra no sistema.

  A IDEIA: o sistema tem dois lugares, e só dois. "Dar aula" é um modo
  — escolhe-se a turma e o dia no alto, e dentro dele há abas: plano,
  ao vivo, chamada, slides, tarefas. "A escola" é todo o resto, também
  em abas. Quando a aula está aberta, o modo aula toma a tela e o resto
  sai do caminho até ela encerrar.

  O que ganha: menu de dois itens, nenhuma dúvida sobre onde algo mora,
  e a aula protegida de distração.
  O que custa: abas dentro de abas, e o resto do trabalho fica atrás de
  um item genérico.

  Contém os 13 blocos de O-QUE-A-PROFESSORA-PRECISA.md § 9.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="professora-modelo.css" />
</head>
<body>
<div id="faixa"></div>
<div class="tela">
  <aside class="lado">
    <div class="marca">Inglês sem Roteiro</div>
    <div class="quem"><div class="bolha">B</div>
      <div><div style="font-weight:700;font-size:14px">Bárbara</div>
        <div style="font-size:11.5px;opacity:.75">professora</div></div></div>
    <nav id="menu" style="display:flex;flex-direction:column;gap:3px"></nav>
  </aside>
  <main class="corpo" id="corpo"></main>
</div>

<script src="professora-modelo-dados.js"></script>
<script src="professora-modelo-blocos.js"></script>
<script src="professora-modelo-shell.js"></script>
<script>
(function () {
  "use strict";
  var D = window.ISR_MODELO, B = window.ISR_BLOCOS, S = window.ISR_SHELL;
  document.getElementById("faixa").innerHTML = S.faixa("C", "duas superfícies");

  var ABAS_AULA = [["plano", "Plano"], ["vivo", "Ao vivo"], ["chamada", "Chamada"],
    ["conteudo", "Slides e caderno"], ["tarefas", "Tarefas entregues"]];
  var ABAS_ESCOLA = [["turmas", "Turmas"], ["clubes", "Clubes"], ["particulares", "Particulares"],
    ["cadernos", "Cadernos"], ["gravacoes", "Gravações"], ["horas", "Minhas horas"],
    ["substituir", "Substituição"]];

  function abas(lista, atual, chave) {
    var h = ['<div class="abas">'];
    lista.forEach(function (x) {
      var p = {}; p[chave] = x[0];
      h.push('<button class="aba' + (atual === x[0] ? " on" : "") + '" ' + B.ir(p) + ">"
        + B.esc(x[1]) + "</button>");
    });
    return h.join("") + "</div>";
  }

  // a faixa de turma e dia: no modelo C é a única troca de contexto
  function contexto(est) {
    var h = ['<div class="tira">'];
    D.SEMANA.forEach(function (s) {
      if (s.clube) {
        h.push('<button class="dia" ' + B.ir({ tela: "escola", abaEscola: "clubes" })
          + "><b>" + B.esc(s.curto) + "</b><span>" + B.esc(s.rotulo) + "</span></button>");
        return;
      }
      var on = s.turma === est.turma && s.data === est.data;
      h.push('<button class="dia' + (on ? " on" : "") + '" '
        + B.ir({ turma: s.turma, data: s.data, vivoAluna: "" })
        + "><b>" + B.esc(s.curto) + "</b><span>" + B.esc(s.rotulo) + "</span></button>");
    });
    return h.join("") + "</div>";
  }

  S.iniciar({
    telaDaAula: "aula",
    inicial: { tela: "aula", abaAula: "plano", abaEscola: "turmas",
      turma: "basics", data: "2026-11-16",
      abaTurma: "geral", abaClube: "pagina", clube: "movie",
      cadFiltro: "por_corrigir", vivoFiltro: "todas", vivoAluna: "" },

    menu: function (est) {
      // com a aula aberta, o resto sai do caminho
      if (D.VIVO.aberta) {
        return [
          { titulo: "em aula", itens: ABAS_AULA.map(function (x) {
            return { label: x[1], on: est.abaAula === x[0],
              vai: { tela: "aula", abaAula: x[0] } }; }) },
          { itens: [{ label: "← encerrar e sair", on: false, vai: { tela: "aula", abaAula: "chamada" } }] }
        ];
      }
      var corrigir = D.porCorrigir().length;
      return [
        { itens: [
          { label: "Dar aula", on: est.tela === "aula", vai: { tela: "aula" } },
          { label: "A escola", on: est.tela === "escola" || est.tela === "turma"
              || est.tela === "clube" || est.tela === "particular" || est.tela === "pulso",
            pino: corrigir ? String(corrigir) : "", vai: { tela: "escola" } }
        ] }
      ];
    },

    render: function (est) {
      var t = D.turma(est.turma), a = D.aula(est.turma, est.data);

      // ── SUPERFÍCIE 1 · DAR AULA ───────────────────────────────
      if (est.tela === "aula") {
        var aba = est.abaAula || "plano", h = [];
        h.push(contexto(est));
        h.push(abas(ABAS_AULA, aba, "abaAula"));
        if (aba === "plano") h.push(B.plano(est));
        if (aba === "vivo") h.push(B.aulaViva(est));
        if (aba === "chamada") h.push(B.chamada(est));
        if (aba === "conteudo") h.push(B.conteudo(est));
        if (aba === "tarefas") {
          var meus = D.CADERNO.filter(function (c) { return c.turma === t.id; });
          h.push('<section class="cartao">' + B.cab("Entregue nesta turma", "",
            '<button class="btn claro pq" ' + B.ir({ tela: "escola", abaEscola: "cadernos", cadFiltro: "todas" })
            + ">Todas as turmas</button>"));
          if (!meus.length) h.push('<div class="nota">Nada entregue nesta turma ainda.</div>');
          meus.forEach(function (c) {
            h.push('<div class="linha"><span class="nome">' + B.esc(c.aluna) + "</span>"
              + '<span class="nota" style="margin:0;flex:1">sessão ' + c.sessao + " · " + B.esc(c.titulo) + "</span>"
              + '<span class="selo ' + (c.corrigido ? "ok" : "alerta") + '">'
              + (c.corrigido ? "corrigida" : "por corrigir") + "</span></div>");
          });
          h.push("</section>");
          h.push(B.cadernos(Object.assign({}, est, { cadFiltro: "por_corrigir" })));
        }
        return { olho: D.VIVO.aberta ? "em aula · " + D.VIVO.minutos + " min" : "dar aula",
          titulo: t.nivel + " · sessão " + a.s,
          sub: a.titulo + " · " + (a.curto === "hoje" ? "hoje, " + (a.hora || "") : a.curto)
            + " · " + t.alunas.length + " alunas",
          html: h.join("") };
      }

      // ── SUPERFÍCIE 2 · A ESCOLA ───────────────────────────────
      if (est.tela === "escola") {
        var ab = est.abaEscola || "turmas", h2 = [];
        h2.push(abas(ABAS_ESCOLA, ab, "abaEscola"));
        if (ab === "turmas") { h2.push(B.hoje(est)); h2.push('<div class="rotulo" style="margin-top:16px">as minhas turmas</div>'); h2.push(B.turmas(est)); }
        if (ab === "clubes") h2.push(B.clubes(est));
        if (ab === "particulares") h2.push(B.particulares(est));
        if (ab === "cadernos") h2.push(B.cadernos(est));
        if (ab === "gravacoes") h2.push(B.gravacoes(est));
        if (ab === "horas") h2.push(B.horas(est));
        if (ab === "substituir") h2.push(B.substituir(est));
        return { olho: "a escola", titulo: "A escola",
          sub: "Tudo o que não é a aula de agora.", html: h2.join("") };
      }

      if (est.tela === "turma") return { olho: "a escola · turmas",
        titulo: t.nivel + " · " + t.quando, sub: t.projeto, html: B.turma(est) };
      if (est.tela === "clube") return { olho: "a escola · clubes",
        titulo: D.clube(est.clube).nome, sub: D.clube(est.clube).quando, html: B.clube(est) };
      if (est.tela === "particular") return { olho: "a escola · particulares",
        titulo: est.particular, sub: "", html: B.particular(est) };
      if (est.tela === "pulso") return { olho: "a escola · aluna",
        titulo: est.aluna, sub: "", html: B.pulso(est) };

      // as telas que os blocos linkam e que, aqui, moram dentro das duas superfícies
      if (est.tela === "plano" || est.tela === "chamada" || est.tela === "conteudo"
        || est.tela === "aulaViva") {
        var mapa = { plano: "plano", chamada: "chamada", conteudo: "conteudo", aulaViva: "vivo" };
        return this.render.call(this, Object.assign(est, { tela: "aula", abaAula: mapa[est.tela] }));
      }
      if (est.tela === "cadernos" || est.tela === "gravacoes" || est.tela === "horas"
        || est.tela === "substituir" || est.tela === "clubes" || est.tela === "turmas"
        || est.tela === "particulares" || est.tela === "hoje") {
        var m2 = { cadernos: "cadernos", gravacoes: "gravacoes", horas: "horas",
          substituir: "substituir", clubes: "clubes", turmas: "turmas",
          particulares: "particulares", hoje: "turmas" };
        return this.render.call(this, Object.assign(est, { tela: "escola", abaEscola: m2[est.tela] }));
      }
      return { titulo: "—", html: "" };
    }
  });
})();
</script>
</body>
</html>
