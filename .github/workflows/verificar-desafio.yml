# A cada publicação, confere que as páginas do desafio (DDMMAA.html)
# mantêm o contrato com o sistema: trava de login, identidade automática
# e registro da semana. Um X vermelho no commit significa que a página
# publicada perdeu parte do modelo — o log da ação diz exatamente o quê.
name: Verificar páginas do desafio

on:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o contrato das páginas
        run: node verificar-desafio.js
