# A cada publicação, confere três contratos do app:
#
# 1. As páginas do desafio (DDMMAA.html) mantêm trava de login,
#    identidade automática e registro da semana.
# 2. O texto de interface segue a linguagem de sistema — sem metáfora,
#    tom de conversa ou frase de venda.
# 3. E não volta para o outro extremo: relatório corporativo, sigla de
#    processo e contabilês onde existe a palavra que todo mundo usa.
#
# Um X vermelho no commit significa que a publicação quebrou um dos
# três; o log da ação diz exatamente o quê e onde.
name: Verificar app

on:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o contrato das páginas do desafio
        run: node verificar-desafio.js
      - name: Conferir a linguagem das telas
        run: node verificar-linguagem.js
      - name: Conferir o jargão das telas
        run: node verificar-jargao.js
