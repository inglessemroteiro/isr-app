<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./isr-versao.js"></script>
<script src="./isr-nav.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .isr-card-frame { transition: transform .18s ease, box-shadow .18s ease; }
  .isr-card-frame:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(22,73,81,.18); }
  .isr-card-frame:hover .isr-open { opacity: 1; }
</style>
</helmet>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#348a8e"/>
    <g transform="translate(30,30)" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#fc9082" stroke="#fff"/>
      <line x1="12" y1="0" x2="12" y2="40" stroke="#fff"/>
      <line x1="20" y1="12" x2="34" y2="12"/>
      <line x1="20" y1="22" x2="34" y2="22"/>
    </g>
  </svg>
</template>
<main style="background: #faf8f3; min-height: 100vh; padding: 48px 40px 80px; font-family: 'Helvetica Neue','Helvetica',sans-serif; color: #164951;">
  <div style="max-width: 1280px; margin: 0 auto;">

    <header style="margin-bottom: 44px;">
      <p style="margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #2a9d8f;">Inglês sem Roteiro</p>
      <h1 style="margin: 0 0 12px; font-size: 40px; font-weight: 700; letter-spacing: -1px;">Caderno do Aluno — Visão Geral</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #6b6155; max-width: 640px;">Todas as telas e documentos do projeto num só lugar. Passe o mouse sobre uma miniatura e clique para abrir a tela em tela cheia.</p>
    </header>

    <sc-for list="{{ groups }}" as="group" hint-placeholder-count="3">
      <section style="margin-bottom: 56px;">
        <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px;">
          <h2 style="margin: 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #164951;">{{ group.name }}</h2>
          <span style="height: 1px; flex: 1; background: #e0dcd6;"></span>
          <span style="font-size: 12px; color: #9b8b7e;">{{ group.count }}</span>
        </div>
        <p style="margin: 0 0 22px; font-size: 13px; color: #9b8b7e;">{{ group.desc }}</p>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;">
          <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="4">
            <a href="{{ item.href }}" class="isr-card-frame" style="display: block; text-decoration: none; background: #fff; border: 1px solid #e6e1d9; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 10px rgba(22,73,81,.06);">
              <div style="position: relative; height: 200px; overflow: hidden; background: #f0ede7; border-bottom: 1px solid #e6e1d9;">
                <iframe src="{{ item.href }}" loading="lazy" scrolling="no" tabindex="-1" style="position: absolute; top: 0; left: 0; width: 1280px; height: 853px; border: 0; transform: scale(0.3125); transform-origin: top left; pointer-events: none;"></iframe>
                <div class="isr-open" style="position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 12px; opacity: 0; transition: opacity .18s ease; background: linear-gradient(180deg, rgba(22,73,81,0) 40%, rgba(22,73,81,.28));">
                  <span style="background: #fff; color: #164951; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.18);">Abrir ↗</span>
                </div>
              </div>
              <div style="padding: 14px 16px; display: flex; align-items: center; gap: 10px;">
                <span style="width: 8px; height: 8px; border-radius: 999px; background: {{ item.dot }}; flex: none;"></span>
                <span style="font-size: 14px; font-weight: 700; color: #164951; line-height: 1.3;">{{ item.title }}</span>
              </div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const T = "#2a9d8f", C = "#e07856", L = "#b8a8d9", O = "#d4a574";
    const mk = (title, file, dot) => ({ title, href: encodeURI(file), dot });
    const groups = [
      {
        name: "Hoje",
        desc: "Por onde o dia começa: o que precisa de você e o que está marcado.",
        items: [
          mk("★ Central do Sistema", "ISR - Central.dc.html", C),
          mk("Agenda da Escola", "ISR - Agenda.dc.html", T),
        ],
      },
      {
        name: "Comercial",
        desc: "Do primeiro contato até a matrícula assinada.",
        items: [
          mk("CRM (Funil de Leads)", "ISR - CRM (Funil de Leads).dc.html", C),
          mk("Mensagens WhatsApp", "ISR - Mensagens WhatsApp.dc.html", T),
          mk("Calculadora de Negociação", "ISR - Calculadora.dc.html", T),
          mk("Marketing · Origens & Conversão", "ISR - Marketing.dc.html", O),
          mk("Cadastro online (link público)", "cadastro.html", O),
        ],
      },
      {
        name: "Financeiro",
        desc: "O que a escola tem a receber e o que já entrou e saiu.",
        items: [
          mk("Cobrança & Renovações", "ISR - Cobrança.dc.html", T),
          mk("Caixa mês a mês", "ISR - Caixa.dc.html", T),
        ],
      },
      {
        name: "Pedagógico",
        desc: "Turmas, aulas, chamada e a experiência da aluna.",
        items: [
          mk("Acompanhamento · quem falar esta semana", "ISR - Acompanhamento.dc.html", C),
          mk("Programa no WhatsApp · 8 semanas", "ISR - Programa.dc.html", O),
          mk("Alunas · como cada uma está", "ISR - Alunas.dc.html", C),
          mk("Turmas & Projetos", "ISR - Turmas e Projetos.dc.html", L),
          mk("Página da Turma", "ISR - Turma.dc.html", L),
          mk("Painel do Professor", "ISR - Painel do Professor.dc.html", L),
          mk("Área da Aluna (com moedas)", "ISR - Aluna.dc.html", C),
          mk("Login da aluna", "aluna.html", T),
        ],
      },
      {
        name: "Escola",
        desc: "Quem é quem, acessos e a ficha de cada pessoa.",
        items: [
          mk("Equipe (papéis e acessos)", "ISR - Equipe.dc.html", L),
          mk("Perfil da Pessoa", "ISR - Perfil.dc.html", L),
        ],
      },
      {
        name: "Produto — Telas principais",
        desc: "As telas do app que compõem a experiência do aluno e do professor.",
        items: [
          mk("★ App Conectado (dados reais)", "ISR App (Conectado).dc.html", C),
          mk("Home (v7 Brand Correct)", "ISR - Home v7 (Brand Correct).dc.html", T),
          mk("Aulas", "ISR - Aulas.dc.html", T),
          mk("Tela de Aula — Editor Colaborativo", "ISR - Tela de Aula (Editor Colaborativo).dc.html", C),
          mk("Comunidade", "ISR - Comunidade.dc.html", T),
          mk("Flin (IA)", "ISR - Flin (IA).dc.html", L),
        ],
      },
      {
        name: "Produto — Novas telas",
        desc: "Telas que cobrem o que faltava do backend: entrada, certificados, push e professor.",
        items: [
          mk("Login (Magic Link)", "ISR - Login (Magic Link).dc.html", T),
          mk("Onboarding", "ISR - Onboarding.dc.html", O),
          mk("Notificações & Renovação", "ISR - Notificações & Renovação.dc.html", C),
          mk("Certificado", "ISR - Certificado.dc.html", T),
        ],
      },
      {
        name: "Explorações de Home",
        desc: "Iterações visuais da tela inicial, da primeira versão à final.",
        items: [
          mk("Home Redesenhada", "ISR - Home Redesenhada.dc.html", O),
          mk("Home v2 (Collage)", "ISR - Home Redesenhada v2 (Collage).dc.html", O),
          mk("Home v3 (Collage Pro)", "ISR - Home v3 (Collage Pro).dc.html", O),
          mk("Home v4 (Design System)", "ISR - Home v4 (Design System).dc.html", O),
          mk("Home v4 com Imagens", "ISR - Home v4 com Imagens.dc.html", O),
          mk("Home v5 (Com Colagens)", "ISR - Home v5 (Com Colagens).dc.html", O),
          mk("Home v6 (Colagens Pro)", "ISR - Home v6 (Colagens Pro).dc.html", O),
        ],
      },
      {
        name: "Estratégia & Documentação",
        desc: "Arquitetura, estratégia de adoção, plano de implementação e design system.",
        items: [
          mk("Arquitetura — Journey do Aluno", "Arquitetura - Journey do Aluno ISR.dc.html", L),
          mk("Estratégia de Adoção & UX", "ISR - Estratégia de Adoção & UX.dc.html", L),
          mk("Implementação — Dinâmico + PWA + Notificações", "Implementacao - Dinamico + PWA + Notificacoes.dc.html", L),
          mk("Brainstorm Caderno do Aluno", "Brainstorm Caderno do Aluno.dc.html", L),
          mk("Design System Visual", "ISR - Design System Visual.dc.html", T),
        ],
      },
    ];
    groups.forEach(g => { g.count = g.items.length + " telas"; });
    return { groups };
  }
}
</script>
</body>
</html>
