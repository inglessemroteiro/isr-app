<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISR — Área do Aluno</title>
<script>
  // A porta de entrada da aluna é o app novo (aluna.html). As telas da
  // primeira geração continuam no ar por endereço direto, mas ninguém
  // mais cai nelas por engano.
  localStorage.removeItem("state");
  // O #hash carrega o token do convite/recuperação do Netlify Identity
  // (o e-mail de convite aponta para a raiz do site). Sem repassá-lo,
  // a aluna convidada nunca conseguiria criar a senha.
  window.location.replace('aluna.html' + window.location.hash);
</script>
</head>
<body></body>
</html>
